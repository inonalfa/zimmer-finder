name: Deploy to GitHub Pages

# One-time setup: Settings > Pages > Source: "GitHub Actions" (forks: also enable Actions in the Actions tab).
# Runs on every push to main and manually (Actions > Deploy to GitHub Pages > Run workflow).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check that GitHub Pages is enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! info=$(gh api "repos/${{ github.repository }}/pages" 2>/dev/null); then
            echo "::error title=GitHub Pages is not enabled::Open https://github.com/${{ github.repository }}/settings/pages , set Source to 'GitHub Actions', then run this workflow again (Actions > Deploy to GitHub Pages > Run workflow). See README > Turn on your site."
            exit 1
          fi
          if [ "$(echo "$info" | jq -r .build_type)" != "workflow" ]; then
            echo "::error title=Pages source is not GitHub Actions::Open https://github.com/${{ github.repository }}/settings/pages and change Source from 'Deploy from a branch' to 'GitHub Actions', then run this workflow again."
            exit 1
          fi
          echo "Pages is enabled: $(echo "$info" | jq -r .html_url)"
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # Optional shared votes (docs/votes-supabase.md) via repository variables:
          VITE_VOTES_ADAPTER: ${{ vars.VITE_VOTES_ADAPTER }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_VOTES_TRIP_ID: ${{ vars.VITE_VOTES_TRIP_ID }}
      - name: "Offline single-file copy (download: <site>/zimmer-finder.html)"
        run: npm run bundle && cp dist-single/zimmer-finder.html dist/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
